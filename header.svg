<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Abu Bakar — Backend Architect, DevOps, Cloud Engineer">
  <defs>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#ec4899;#f97316;#a855f7" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#f97316;#a855f7;#ec4899" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f97316">
        <animate attributeName="stop-color" values="#f97316;#a855f7;#ec4899;#f97316" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <text x="400" y="92" text-anchor="middle"
        font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif"
        font-size="54" font-weight="800" letter-spacing="3"
        fill="url(#nameGrad)">ABU BAKAR</text>

  <text x="400" y="132" text-anchor="middle"
        font-family="'Courier New', monospace"
        font-size="16" font-weight="600" letter-spacing="4"
        fill="#94a3b8">BACKEND ARCHITECT &#183; DEVOPS &#183; CLOUD ENGINEER</text>

  <line x1="270" y1="158" x2="530" y2="158" stroke="url(#nameGrad)" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="x1" values="400;270;400" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="400;530;400" dur="4s" repeatCount="indefinite"/>
  </line>
</svg>
